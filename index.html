<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft 3D Clone</title>
  <style>
    body { margin: 0; overflow: hidden; background: #87CEEB; }
    canvas { display: block; }
    #info {
      position: absolute;
      top: 15px;
      left: 15px;
      color: white;
      font-family: Arial, sans-serif;
      background: rgba(0,0,0,0.5);
      padding: 10px 15px;
      border-radius: 8px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="info">
    WASD = Move<br>
    Mouse = Look around<br>
    Click to lock mouse
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Scene setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 10, 80);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Light
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(50, 100, 50);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    // Create ground blocks
    const blockSize = 1;
    const geometry = new THREE.BoxGeometry(blockSize, blockSize, blockSize);
    
    // Grass material
    const grassMaterial = new THREE.MeshLambertMaterial({ color: 0x4CAF50 });
    // Dirt material
    const dirtMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });

    // Generate flat world
    for (let x = -20; x < 20; x++) {
      for (let z = -20; z < 20; z++) {
        const block = new THREE.Mesh(geometry, grassMaterial);
        block.position.set(x * blockSize, 0, z * blockSize);
        scene.add(block);

        // Add some dirt under
        const dirt = new THREE.Mesh(geometry, dirtMaterial);
        dirt.position.set(x * blockSize, -1, z * blockSize);
        scene.add(dirt);
      }
    }

    // Player controls
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();

    document.addEventListener('keydown', (e) => {
      if (e.code === 'KeyW') moveForward = true;
      if (e.code === 'KeyS') moveBackward = true;
      if (e.code === 'KeyA') moveLeft = true;
      if (e.code === 'KeyD') moveRight = true;
    });

    document.addEventListener('keyup', (e) => {
      if (e.code === 'KeyW') moveForward = false;
      if (e.code === 'KeyS') moveBackward = false;
      if (e.code === 'KeyA') moveLeft = false;
      if (e.code === 'KeyD') moveRight = false;
    });

    // Mouse look
    let isLocked = false;
    document.body.addEventListener('click', () => {
      document.body.requestPointerLock();
    });

    document.addEventListener('pointerlockchange', () => {
      isLocked = document.pointerLockElement === document.body;
    });

    let yaw = 0, pitch = 0;
    document.addEventListener('mousemove', (e) => {
      if (!isLocked) return;
      yaw -= e.movementX * 0.002;
      pitch -= e.movementY * 0.002;
      pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
    });

    // Starting position
    camera.position.set(0, 2, 5);

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);

      // Movement
      velocity.x = 0;
      velocity.z = 0;

      direction.z = Number(moveForward) - Number(moveBackward);
      direction.x = Number(moveRight) - Number(moveLeft);
      direction.normalize();

      if (moveForward || moveBackward) velocity.z = direction.z * 0.15;
      if (moveLeft || moveRight) velocity.x = direction.x * 0.15;

      // Apply rotation to movement
      const moveX = velocity.x * Math.cos(yaw) + velocity.z * Math.sin(yaw);
      const moveZ = velocity.z * Math.cos(yaw) - velocity.x * Math.sin(yaw);

      camera.position.x += moveX;
      camera.position.z += moveZ;

      // Look
      camera.rotation.order = 'YXZ';
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;

      renderer.render(scene, camera);
    }

    animate();

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
